# Cloudflare Tunnel — 시연에서만 띄운다 (이슈 #174)
#
# **별도 파일인 이유는 수명이 다르기 때문이다.** 시연 스택 둘은 리허설 내내
# 떠 있어도 되지만(#179), 터널은 `infra-decision.md` 2.1이 **"시연 직전에 열고
# 직후에 닫는다"**로 정했다. 같은 compose에 넣으면 `./holdfast demo` 가 터널까지
# 함께 띄우게 되고, 그러면 상시로 두는 것과 같아진다.
#
# **프로젝트도 따로다**(`holdfast-tunnel`). 두 시연 스택 어느 쪽에도 속하지
# 않으므로 — 하나가 아니라 셋을 실는다.
services:
  cloudflared:
    image: cloudflare/cloudflared:2025.8.1
    # **버전을 고정한다.** latest 로 두면 발표 당일에 바뀐 이미지를 받는다.
    command: tunnel --config /etc/cloudflared/config.yml run
    environment:
      TUNNEL_ID: ${TUNNEL_ID:?TUNNEL_ID 가 필요하다 — infra/tunnel/README.md 참고}
    volumes:
      - ./infra/tunnel/config.yml:/etc/cloudflared/config.yml:ro
      - ./infra/tunnel/credentials.json:/etc/cloudflared/credentials.json:ro
    # 오리진이 호스트의 8080·8090 이다. 두 시연 스택이 서로 다른 compose
    # 프로젝트라(#179) 컨테이너 네트워크로는 못 닿는다.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: "no"
