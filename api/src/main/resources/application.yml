server:
  port: ${PORT:8080}
  tomcat:
    threads:
      # concurrency-spec 7.3 고정 변수: "Tomcat max-threads — 명시적 고정".
      # 값 자체는 Boot 기본값과 같지만, 기본값에 기대면 Boot 버전이 올라갈 때
      # 측정 조건이 조용히 바뀐다. 전 전략 동일 값을 쓰고 보고서에 명시한다.
      max: ${TOMCAT_MAX_THREADS:200}

spring:
  application:
    name: holdfast
  datasource:
    # 로컬: db 컨테이너. AWS: RDS 엔드포인트로 DB_HOST만 교체.
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:holdfast}
    username: ${DB_USER:holdfast}
    password: ${DB_PASSWORD:holdfast}
    driver-class-name: org.postgresql.Driver
    hikari:
      # 7.3 고정 변수 중 **가장 위험한 값**이다. "기본 10 금지" — VU 500을
      # 기본 풀 10에 때리면 락 대기가 아니라 커넥션 대기를 측정하게 된다.
      #
      # 30인 근거: 앱 2대 × 30 = 60으로 Postgres 기본 max_connections 100 안에
      # 들어가고, 시드·검증용 psql 접속 여유가 남는다. 풀을 스레드 수(200)까지
      # 키우면 DB 접속 상한을 넘는다.
      #
      # 풀 대기(hikaricp.connections.pending)는 없애야 할 값이 아니라
      # "해석의 핵심"이므로(7.1) 지우지 않고 잰다.
      maximum-pool-size: ${DB_POOL_SIZE:30}
  jpa:
    hibernate:
      # validate — 엔티티와 스키마가 정확히 일치하는지만 확인하고 DDL을
      # 만들지 않는다. 스키마는 Flyway 마이그레이션(db/migration/)이 정본이다.
      # setup.md의 "스캐폴딩 단계 전용" 주의사항은 이 전환으로 해소됐다.
      ddl-auto: ${JPA_DDL_AUTO:validate}
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  data:
    redis:
      # 로컬: redis 컨테이너. AWS: ElastiCache 엔드포인트로 REDIS_HOST만 교체.
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  mvc:
    problemdetails:
      # api-spec.md: "Spring Boot 4가 처리하지 못한 예외에도 같은 형식을
      # 내보내므로" — 프레임워크가 만드는 오류 응답(타입 불일치 등)도
      # RFC 9457 ProblemDetail 형태로 나가게 한다.
      enabled: true

# 인스턴스 식별자 — 로드밸런싱 확인용
holdfast:
  instance-id: ${INSTANCE_ID:local}
  # 선점 유지 시간(초). concurrency-spec.md 3절: 운영 5분, 부하 측정 시 10초로
  # 낮춰 쓴다. SeatMap 응답(holdTtlSeconds)에 그대로 노출해 클라이언트가
  # 하드코딩하지 않게 한다.
  hold-ttl-seconds: ${HOLD_TTL_SECONDS:300}
  # 비관적 락의 행 락 대기 상한(ms). concurrency-spec 7.3 고정 변수 = 1초.
  #
  # pessimistic 전략만 SET LOCAL로 자기 트랜잭션에 건다. 서버 전역으로 두면
  # 나머지 네 전략의 대기 특성까지 바뀌어 전략 비교가 오염된다. 상한이 없으면
  # 무한 대기이고, 비관적 락은 대기 중 커넥션을 쥐므로(4.2) 풀이 먼저 말라
  # 측정 대상이 락 경합에서 커넥션 고갈로 바뀐다.
  lock-timeout-ms: ${LOCK_TIMEOUT_MS:1000}
  # 낙관적 락 재시도(concurrency-spec.md 4.3).
  #
  # **상한 3회는 설계값이 아니라 시작값이다.** 고경합에서 재시도 분포를 관측한
  # 뒤 조정하고, 조정 전후 값을 함께 기록한다(4.3). 그래서 프로퍼티로 뺐다.
  # 최초 시도는 상한에 포함되지 않는다 — 3이면 최대 4번 시도한다.
  #
  # 백오프 기준 간격이 2ms로 작은 이유는 이 응용의 임계 구역이 서브밀리초이기
  # 때문이다(7.7.1). 수십 ms를 쉬면 재시도가 아니라 대기를 재게 된다.
  optimistic:
    max-retries: ${OPTIMISTIC_MAX_RETRIES:3}
    backoff-base-ms: ${OPTIMISTIC_BACKOFF_BASE_MS:2}
  # Redis 분산락(concurrency-spec.md 4.5). 둘 다 7.3 고정 변수다.
  #
  # lease-time-ms를 반드시 명시한다. 생략하면 Redisson 워치독이 30초 리스를
  # 10초마다 자동 연장하는데, 락을 오래 쥐는 버그가 측정에서 가려지고 실행마다
  # 결과가 달라진다(4.5).
  #
  # wait-time-ms 1초는 검수 기준 p95 3초의 시간 예산에서 나온 값이다. 락 대기에
  # 3초를 다 주면 DB·앱·네트워크에 쓸 예산이 남지 않는다(7.3).
  redis:
    wait-time-ms: ${REDIS_LOCK_WAIT_MS:1000}
    lease-time-ms: ${REDIS_LOCK_LEASE_MS:10000}
  # 락 전략 스위치(concurrency-spec.md 4절). none/pessimistic/optimistic/unique/redis.
  # k6 시나리오는 고정하고 이 값만 바꿔 측정한다.
  #
  # 다섯 전략이 모두 구현됐다.
  #
  # 주의: none일 때만 seed.sh가 U-2 인덱스를 지운다. 나머지 전략은 U-2를 걸고
  # 측정해야 제약 위반 카운터가 의미를 갖는다(7.6). 그 의미는 전략마다 다르다 —
  # pessimistic·optimistic·redis에서 0이 아니면 앱 락이 샌 것이고,
  # unique에서는 0이 아닌 것이 정상 동작이다(4.4).
  #
  # 기본값이 none인 것은 M2가 베이스라인(실패 재현) 단계이기 때문이다.
  # none은 초과 예약을 막지 않는다 — 그것이 이 전략의 목적이다(4.1).
  strategy: ${HOLDFAST_STRATEGY:none}
  # Mock PG(state-transitions.md 5.2 주입 파라미터).
  #
  # **기본값 approve는 concurrency-spec 7.3 고정 변수다.** 락 전략 비교 시나리오에
  # 결제 거절·지연이 섞이면 어느 지연이 락 대기이고 어느 것이 결제인지 구분할 수
  # 없게 되어 측정이 오염된다. 측정 시 이 값을 바꾸지 않는다.
  #
  # 5.2절의 delay-ms·delay-jitter-ms·callback-delay-ms와 outcome의 timeout·fail은
  # 최소 완결 범위 밖이라(#79, #66) 아직 없다. 선언만 해두면 "주입했는데 아무 일도
  # 안 일어나는" 상태가 되어 나중에 값이 먹은 줄 알고 잘못 읽게 된다.
  mock-pg:
    # approve / decline / random
    outcome: ${MOCK_PG_OUTCOME:approve}
    # outcome=random일 때 승인이 나올 비율
    approve-ratio: ${MOCK_PG_APPROVE_RATIO:0.8}
  # 알림 발송 Mock(REQ-05, 이슈 #78). 실제 발송은 design-spec 4.3 제외 항목이다.
  #
  # 기본값이 send인 이유는 Mock PG와 같다(7.3) — 부하 측정에 실패를 섞으면
  # 재시도 부하가 확정 부하와 뒤엉켜 무엇을 재는지 흐려진다.
  notification:
    # send / fail / random
    outcome: ${NOTIFICATION_OUTCOME:send}
    # outcome=random일 때 실패가 나올 비율
    fail-ratio: ${NOTIFICATION_FAIL_RATIO:0.0}
  # 알림 Outbox 워커(REQ-05, 이슈 #78).
  #
  # **앱 2대에서 동시에 돈다.** 인스턴스 단위로 배제하지 않고 행 단위로 경쟁시킨다 —
  # 근거는 OutboxWorker javadoc에 있다. 중복 발송은 클레임의 조건부 UPDATE가 막는다.
  #
  # 재시도 값이 optimistic(4.3)과 다른 이유는 기다리는 대상이 다르기 때문이다.
  # 4.3은 같은 행을 다투는 다른 요청을 기다리므로 경합 창이 서브밀리초이고,
  # 백오프가 곧 스레드 점유라 2ms로 짧다. 여기서는 회복되지 않은 외부 시스템을
  # 기다리고, 실패한 행을 놓아준 뒤 next_retry_at만 적으므로 기다리는 동안
  # 아무 자원도 쥐지 않는다. 1초를 쉬어도 워커는 그 사이 다른 행을 처리한다.
  outbox:
    scheduler:
      # false면 워커는 그대로 두고 자동 실행만 멈춘다. 경합 테스트가 쓴다.
      enabled: ${OUTBOX_SCHEDULER_ENABLED:true}
    # 이전 사이클이 끝난 뒤부터 센다(fixedDelay). 겹쳐 쌓이지 않게 한다.
    poll-interval-ms: ${OUTBOX_POLL_INTERVAL_MS:1000}
    batch-size: ${OUTBOX_BATCH_SIZE:50}
    # 최초 시도는 포함되지 않는다 — 5면 최대 6번 시도한다.
    max-retries: ${OUTBOX_MAX_RETRIES:5}
    backoff-base-ms: ${OUTBOX_BACKOFF_BASE_MS:1000}
    backoff-max-ms: ${OUTBOX_BACKOFF_MAX_MS:60000}
    # SENDING인 채로 이만큼 지나면 집은 워커가 죽은 것으로 보고 되찾는다.
    # **발송 최대 소요 시간보다 넉넉해야 한다** — 짧으면 살아 있는 워커가
    # 발송하는 동안 남이 같은 행을 가져가 중복 발송이 난다.
    claim-timeout-seconds: ${OUTBOX_CLAIM_TIMEOUT_SECONDS:30}

management:
  endpoints:
    web:
      exposure:
        # metrics — 7.1이 커넥션 풀 대기의 출처로 못박은
        # hikaricp.connections.pending / .acquire 를 읽기 위해 연다.
        # 응답시간의 정본은 k6이므로(7.1) HTTP 히스토그램은 켜지 않는다.
        include: health,info,metrics
