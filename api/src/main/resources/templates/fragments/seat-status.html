<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<!--
    좌석 상태 폴링 fragment. GET /api/sessions/{id}/seats/status의
    Accept: text/html 응답이다. htmx가 이 fragment만 3초마다 교체한다
    (concurrency-spec.md 0.4).

    좌석맵 레이아웃·스타일은 이 이슈(#37, 조회 API)의 범위가 아니다
    (design-spec.md 5.3 — "좌석 맵 UI에 시간을 쏟지 않는다"). 여기서는
    JSON과 같은 데이터(seatId·status)를 서버에서 렌더링하는 경로가
    동작한다는 것만 증명한다. 실제 좌석 배치 UI는 별도 작업에서 만든다.
-->
<body>
<ul th:fragment="seatStatus">
    <li th:each="seat : ${seats}"
        th:attr="data-seat-id=${seat.seatId()}"
        th:class="|seat status-${seat.status()}|"
        th:text="|${seat.seatId()}: ${seat.status()}|">
    </li>
</ul>
</body>
</html>
