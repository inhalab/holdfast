<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<!--
  모든 서버렌더 화면의 바닥. 두 가지를 담는다.

  1) **응답한 인스턴스** — 앱 2대 구성이 화면으로 보이는 유일한 자리다.
     새로고침하면 app1/app2가 번갈아 찍힌다(PageModelAdvice).
  2) **어디로든 갈 수 있는 링크** — 좌석맵·검표는 나가는 링크가 하나도 없어
     뒤로가기 말고는 빠져나올 수 없었다.
-->
<body>
<footer th:fragment="foot" class="page-foot">
    <nav class="foot-links">
        <a th:href="@{/programs}">프로그램</a>
        <a th:href="@{/scan}">검표</a>
        <a th:href="@{/demo/race}">동시성 데모</a>
        <a th:href="@{/admin/programs}">관리자</a>
    </nav>
    <span class="instance-badge" title="이 페이지를 처리한 앱 인스턴스">
        <span th:text="${instanceId}">app1</span>
    </span>
</footer>
</body>
</html>
