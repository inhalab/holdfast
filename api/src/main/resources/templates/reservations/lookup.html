<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>예약 조회</title>
    <link rel="stylesheet" th:href="@{/css/reservation.css}">
</head>
<body>
<main class="page">
    <h1>예약 조회</h1>
    <p class="meta">예약번호와 예약자 번호로 예약을 찾습니다.</p>

    <!--
      실패는 리다이렉트하지 않고 그 자리에서 그린다 — 앱이 2대라 플래시가
      로드밸런서를 못 넘는다(design-spec 5.5). 폼도 함께 남아 값을 고칠 수 있다.
    -->
    <div class="flash flash-error" th:if="${error}" role="alert" th:text="${error}"></div>

    <section class="card">
        <form method="get" th:action="@{/reservations/lookup}" class="admin-form">
            <label>예약번호
                <input type="number" name="reservationId" min="1" required
                       th:value="${reservationId}">
            </label>
            <label>예약자 번호
                <input type="number" name="userId" min="1" required th:value="${userId}">
            </label>
            <button type="submit">조회</button>
        </form>
    </section>

    <!--
      한계를 화면에 적는다. 이 값들은 추측할 수 있고, 막으려면 인증이 필요한데
      인증은 배제했다(rfp-scope 4.3 — 측정 하네스가 깨진다).
    -->
    <p class="meta">
        <strong>이 화면은 접근 제어를 하지 않습니다.</strong> 예약자 번호는 인증이
        아니라 <strong>누구의 예약을 볼지 정하는 값</strong>입니다. 이 프로젝트는
        인증을 구현하지 않았고, API 수준에서 이미 같은 값을 자유롭게 보낼 수
        있으므로 화면만 잠그는 것은 아무것도 막지 못합니다.
    </p>

    <p class="meta">
        <a class="link-back" th:href="@{/my/reservations}">내 예약 전체 보기 →</a>
    </p>
</main>
<footer th:replace="~{fragments/page-foot :: foot}"></footer>
</body>
</html>
