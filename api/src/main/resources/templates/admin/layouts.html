<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>관리자 — 좌석배치도</title>
    <link rel="stylesheet" th:href="@{/css/reservation.css}">
</head>
<body>
<main class="page admin-page">
    <h1>좌석배치도 관리</h1>
    <p class="meta">배치도에 구역과 좌석을 만들어 두면 회차 등록에서 고를 수 있습니다.</p>

    <!-- 검증 결과. 조용히 저장되면 관리자가 무엇이 잘못됐는지 알 수 없다. -->
    <div class="flash flash-error" th:if="${error}" role="alert" th:text="${error}"></div>

    <section class="card">
        <h2>배치도 등록</h2>
        <form method="post" th:action="@{/admin/layouts}" class="admin-form">
            <label>이름 <input type="text" name="name" required placeholder="대강당 1층"></label>
            <button type="submit">등록</button>
        </form>
        <p class="meta">등록하면 바로 구역·좌석을 넣는 화면으로 넘어갑니다.</p>
    </section>

    <section class="card">
        <h2>배치도 목록</h2>
        <table class="admin-table" th:if="${not #lists.isEmpty(layouts)}">
            <thead>
                <tr><th>ID</th><th>이름</th><th>구역</th><th>좌석</th><th>쓰는 회차</th><th></th></tr>
            </thead>
            <tbody>
                <tr th:each="l : ${layouts}">
                    <td th:text="${l.id}">1</td>
                    <td th:text="${l.name}">데모 배치도</td>
                    <td th:text="${l.zoneCount} + '개'">2개</td>
                    <td th:text="${l.seatCount} + '석'">24석</td>
                    <!--
                      쓰는 회차가 0인지가 삭제·수정 가능 여부다.
                      정책과 근거는 AdminSeatLayoutService 클래스 주석에 있다.
                    -->
                    <td>
                        <span th:if="${l.deletable}" class="meta">없음 (수정 가능)</span>
                        <span th:unless="${l.deletable}" th:text="${l.sessionCount} + '개 (고정됨)'">1개</span>
                    </td>
                    <td><a th:href="@{/admin/layouts/{id}(id=${l.id})}">구역·좌석 →</a></td>
                </tr>
            </tbody>
        </table>
        <p th:if="${#lists.isEmpty(layouts)}">등록된 배치도가 없습니다.</p>
    </section>

    <p class="meta">
        <a class="link-back" th:href="@{/admin/programs}">프로그램·회차</a> ·
        <a class="link-back" th:href="@{/admin/reservations}">예약 현황</a> ·
        <a class="link-back" th:href="@{/programs}">사용자 화면</a>
    </p>
</main>
</body>
</html>
