<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>관리자 — 예약 현황</title>
    <link rel="stylesheet" th:href="@{/css/reservation.css}">
</head>
<body>
<main class="page admin-page">
    <h1>예약 현황</h1>
    <p class="meta">
        조회 전용 화면입니다. 등록은
        <a th:href="@{/admin/programs}">프로그램·회차</a>와
        <a th:href="@{/admin/layouts}">좌석배치도</a>에서 합니다.
    </p>

    <section class="card">
        <h2>회차별 좌석 현황</h2>
        <div class="table-scroll" th:if="${not #maps.isEmpty(seatSummary)}">
        <table class="admin-table">
            <thead>
                <tr>
                    <th>회차</th>
                    <th>AVAILABLE</th>
                    <th>HELD</th>
                    <th>SOLD</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="entry : ${seatSummary}">
                    <td><a th:href="@{/sessions/{id}(id=${entry.key}, userId=1)}"
                           th:text="${entry.key}" target="_blank">1</a></td>
                    <td th:text="${entry.value.get('AVAILABLE')} ?: 0">0</td>
                    <td th:text="${entry.value.get('HELD')} ?: 0">0</td>
                    <td th:text="${entry.value.get('SOLD')} ?: 0">0</td>
                </tr>
            </tbody>
        </table>
        </div>
        <p th:if="${#maps.isEmpty(seatSummary)}">좌석 데이터가 없다.</p>
    </section>

    <section class="card">
        <h2>예약 목록 <span class="meta">(최근 200건)</span></h2>
        <div class="table-scroll" th:if="${not #lists.isEmpty(reservations)}">
        <table class="admin-table">
            <thead>
                <tr>
                    <th>예약번호</th>
                    <th>회차</th>
                    <th>사용자</th>
                    <th>상태</th>
                    <th>좌석</th>
                    <th>금액</th>
                    <th>생성</th>
                    <th>확정</th>
                    <th>취소</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="r : ${reservations}">
                    <!--
                      예약번호 → 그 예약의 확인 화면. **userId를 실어 보낸다.**
                      화면은 소유자의 예약만 보여주므로(ReservationService#get이
                      남의 예약을 404로 막는다) 링크가 그 값을 들고 가야 열린다.
                      관리자라고 소유권 검사를 건너뛰게 만들지 않는다 — 인증이
                      없는 상태에서 "관리자는 예외"를 두면 아무나 그 예외를 쓴다.
                      관리자 화면은 이미 소유자 id를 알고 있으니 링크에 담으면 된다.
                    -->
                    <td><a th:href="@{/reservations/{id}(id=${r.reservationId}, userId=${r.userId})}"
                           th:text="${r.reservationId}" target="_blank">1</a></td>
                    <td><a th:href="@{/sessions/{id}(id=${r.sessionId}, userId=${r.userId})}"
                           th:text="${r.sessionId}" target="_blank">1</a></td>
                    <td th:text="${r.userId}">1</td>
                    <td><span class="status-badge" th:classappend="${r.status}" th:text="${r.status}">CONFIRMED</span></td>
                    <td>
                        <ul class="seat-chip-list">
                            <li th:each="seat : ${r.seats}" th:text="${seat.zoneName} + ' ' + ${seat.seatNo}">A구역 A-1</li>
                        </ul>
                    </td>
                    <td th:text="${r.totalAmount}">0</td>
                    <td th:text="${r.createdAt}">-</td>
                    <td th:text="${r.confirmedAt} ?: '-'">-</td>
                    <td th:text="${r.cancelledAt} ?: '-'">-</td>
                </tr>
            </tbody>
        </table>
        </div>
        <p th:if="${#lists.isEmpty(reservations)}">예약이 없다.</p>
    </section>
</main>
</body>
</html>
