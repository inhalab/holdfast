plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.1'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.inhalab'
version = '0.0.1'

java {
    toolchain {
        // 팀 확정 스택: Java 25 (Spring Boot 4.1은 Java 17 최소, 25 first-class 지원)
        languageVersion = JavaLanguageVersion.of(25)
    }
}

repositories {
    mavenCentral()
}

dependencyManagement {
    imports {
        // Boot 4.1의 BOM은 testcontainers 모듈 버전을 관리하지 않는다.
        // spring-boot-testcontainers가 끌어오는 코어와 같은 줄로 맞춘다.
        mavenBom 'org.testcontainers:testcontainers-bom:2.0.5'
    }
}

dependencies {
    // 웹 + 서버렌더(Thymeleaf)
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'

    // JPA — 락 전략의 핵심. 비관적 락 @Lock, 낙관적 락 @Version 을 어노테이션으로.
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'

    // Flyway — 스키마 마이그레이션. JPA_DDL_AUTO=validate와 짝을 이룬다.
    // Flyway 10+부터 DB별 지원이 별도 모듈로 분리되어 postgresql 모듈을 함께 넣는다.
    implementation 'org.flywaydb:flyway-core'
    implementation 'org.flywaydb:flyway-database-postgresql'
    // Boot 4는 spring-boot-autoconfigure 단일체를 기능별 모듈로 쪼갰다
    // (spring-boot-jdbc, spring-boot-hibernate처럼). Flyway 자동설정
    // (FlywayAutoConfiguration)도 이 모듈에 있어 flyway-core만으로는 동작하지 않는다.
    implementation 'org.springframework.boot:spring-boot-flyway'

    // Redis — 분산락(Redisson). Boot 4.1.x는 스타터만으로 충분(내부 spring-data-41 번들).
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'
    implementation 'org.redisson:redisson-spring-boot-starter:4.7.0'

    // htmx — 서버렌더 화면의 부분 갱신용(webjar로 정적 제공)
    implementation 'org.webjars.npm:htmx.org:2.0.4'

    // PostgreSQL 드라이버
    runtimeOnly 'org.postgresql:postgresql'

    // 헬스체크 등 운영 엔드포인트
    implementation 'org.springframework.boot:spring-boot-starter-actuator'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    // Boot 4는 테스트 슬라이스 자동설정도 기능별로 쪼갰다(위 flyway 주석과 같은 이유).
    // @WebMvcTest는 spring-boot-test-autoconfigure에 없고 이 모듈에 있다.
    testImplementation 'org.springframework.boot:spring-boot-webmvc-test'

    // 단위 경합 테스트는 실제 Postgres에서 돌린다. concurrency-spec 8절:
    // "H2를 쓰지 않는다. FOR UPDATE 의미론이 Postgres와 달라 동시성 테스트가
    // 통과해도 아무것도 보장하지 않는다."
    //
    // Testcontainers 2.x에서 모듈 아티팩트 이름이 바뀌었다.
    // 1.x의 org.testcontainers:junit-jupiter / :postgresql은 2.x에 없고
    // :testcontainers-junit-jupiter / :testcontainers-postgresql이다.
    // 버전은 Boot가 관리하지 않으므로 testcontainers-bom을 import해 맞춘다.
    testImplementation 'org.springframework.boot:spring-boot-testcontainers'
    testImplementation 'org.testcontainers:testcontainers-junit-jupiter'
    testImplementation 'org.testcontainers:testcontainers-postgresql'
}

tasks.named('test') {
    useJUnitPlatform()
}
