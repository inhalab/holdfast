# 로컬 다중 인스턴스 환경 (Spring Boot 4.1 / PostgreSQL 18 / Redis).
# 설계 명세 5.2: "단일 인스턴스로만 부하 테스트하면 분산락의 의미가 없다" → 앱 2대.
#
#   nginx(로드밸런서, :8080)
#     ├─ app1 ┐
#     └─ app2 ┴─ 같은 postgres·redis 공유
#
# 실행:  docker compose up --build
# 확인:  curl.exe http://localhost:8080/api/status   (instance가 app1/app2 번갈아)
#        curl.exe http://localhost:8080/api/health   (db/redis up)

services:
  db:
    image: postgres:18-alpine
    # concurrency-spec 7.3 고정 변수: deadlock_timeout 200ms.
    # 데드락 검증 시나리오(7.2.1)가 pg_stat_database.deadlocks를 읽어 판정하는데,
    # 기본값 1초로 두면 검출이 느려 짧은 실행에서 놓친다.
    command: ["postgres", "-c", "deadlock_timeout=200ms"]
    environment:
      POSTGRES_DB: holdfast
      POSTGRES_USER: holdfast
      POSTGRES_PASSWORD: holdfast
    ports:
      - "5432:5432"
    volumes:
      # postgres:18 이미지는 PGDATA가 /var/lib/postgresql/18/docker (버전별 하위 디렉터리)라 옛 관례인
      # .../data가 아닌 부모 경로를 마운트해야 메이저 버전이 바뀌어도 볼륨이 실제 데이터 위치를 계속 포함한다.
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U holdfast -d holdfast"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  app1:
    build: ./api
    # nginx(:8080)는 두 인스턴스를 라운드로빈하므로 그 경유로는 "이 인스턴스의
    # 풀 대기"를 확정할 수 없다. 인스턴스별 관측(concurrency-spec 7.1, 이슈 #44)을
    # 위해 컨테이너를 직접 찌를 수 있게 호스트 포트를 연다.
    ports:
      - "18081:8080"
    environment:
      PORT: 8080
      INSTANCE_ID: app1
      # 7.3 고정 변수. 이 세 값은 앱 2대가 반드시 같아야 한다.
      HOLD_TTL_SECONDS: ${HOLD_TTL_SECONDS:-10}
      DB_POOL_SIZE: ${DB_POOL_SIZE:-30}
      TOMCAT_MAX_THREADS: ${TOMCAT_MAX_THREADS:-200}
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: holdfast
      DB_PASSWORD: holdfast
      DB_NAME: holdfast
      JPA_DDL_AUTO: validate  # Flyway가 스키마를 만들고, JPA는 엔티티와 일치하는지만 검증한다.
      # 락 전략 스위치(concurrency-spec 4절). 측정할 때 이 값만 바꾼다.
      # 현재 구현된 것은 none(베이스라인)뿐이다.
      # 주의: none으로 측정할 때는 seed.sh가 U-2 인덱스를 지운다(erd.md 3.1).
      HOLDFAST_STRATEGY: ${HOLDFAST_STRATEGY:-none}
      # Mock PG 주입(state-transitions.md 5.2). 앱 2대가 반드시 같아야 한다 —
      # 한쪽만 decline이면 어느 인스턴스가 받았는지에 따라 결과가 갈린다.
      # 기본 approve는 7.3 고정 변수다. 락 측정 중에는 바꾸지 않는다.
      MOCK_PG_OUTCOME: ${MOCK_PG_OUTCOME:-approve}
      MOCK_PG_APPROVE_RATIO: ${MOCK_PG_APPROVE_RATIO:-0.8}
      REDIS_HOST: redis
      REDIS_PORT: 6379
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  app2:
    build: ./api
    ports:
      - "18082:8080"
    environment:
      PORT: 8080
      INSTANCE_ID: app2
      # app1과 동일해야 한다(7.3). 한쪽만 바꾸면 두 인스턴스가 다른 조건으로 돌아
      # 측정이 오염된다.
      HOLD_TTL_SECONDS: ${HOLD_TTL_SECONDS:-10}
      DB_POOL_SIZE: ${DB_POOL_SIZE:-30}
      TOMCAT_MAX_THREADS: ${TOMCAT_MAX_THREADS:-200}
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: holdfast
      DB_PASSWORD: holdfast
      DB_NAME: holdfast
      JPA_DDL_AUTO: validate
      HOLDFAST_STRATEGY: ${HOLDFAST_STRATEGY:-none}
      # Mock PG 주입(state-transitions.md 5.2). 앱 2대가 반드시 같아야 한다 —
      # 한쪽만 decline이면 어느 인스턴스가 받았는지에 따라 결과가 갈린다.
      # 기본 approve는 7.3 고정 변수다. 락 측정 중에는 바꾸지 않는다.
      MOCK_PG_OUTCOME: ${MOCK_PG_OUTCOME:-approve}
      MOCK_PG_APPROVE_RATIO: ${MOCK_PG_APPROVE_RATIO:-0.8}
      REDIS_HOST: redis
      REDIS_PORT: 6379
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - app1
      - app2

volumes:
  db-data:
