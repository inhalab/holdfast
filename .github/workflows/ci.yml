name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 애플리케이션이 없으면(스캐폴딩 전) 빌드를 건너뛴다.
      # gradlew는 api/ 디렉토리에 있다.
      - name: 애플리케이션 존재 여부 확인
        id: check
        run: |
          if [ -f api/gradlew ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "스캐폴딩 전입니다. 빌드를 건너뜁니다."
          fi

      # 프로젝트가 요구하는 JDK 25 세팅. gradle 캐시도 함께.
      - name: JDK 25 설정
        if: steps.check.outputs.exists == 'true'
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      - name: 빌드 및 테스트
        if: steps.check.outputs.exists == 'true'
        working-directory: api
        run: |
          chmod +x gradlew
          ./gradlew build

  # ───────────────────────────────────────────────────────────────────────
  # 이미지가 실제로 뜨는가 (이슈 #144)
  #
  # **위 build 잡이 통과해도 컨테이너가 못 뜰 수 있다.** #143에서 테스트가 전부
  # 통과하는 동안 main이 기동하지 못했다. 테스트는
  # `@SpringBootTest(properties = ...)`로 값을 직접 주므로 application.yml의
  # `${HOLDFAST_STRATEGY:none}` 경로를 **건너뛴다.** 같은 부류를 #148에서 한 번 더
  # 밟았다 — application.yml에 프로퍼티를 선언했는데 docker-compose.yml에 없어
  # 환경변수가 컨테이너에 닿지 않았고, 그때도 테스트는 전부 통과했다.
  #
  # 그래서 이 잡이 보는 것은 컴파일도 로직도 아니고 셋이다.
  #   1. jar가 만들어지고 이미지가 빌드되나
  #   2. docker-compose.yml의 환경변수로 그 jar가 기동하나
  #   3. application.yml의 자리표시자가 실제로 풀리나
  #
  # **build와 병렬로 돈다(needs 없음).** 컴파일이 깨지면 양쪽 다 빨갛게 되지만,
  # 원인이 하나라도 신호는 함께 오는 편이 빠르다.
  # ───────────────────────────────────────────────────────────────────────
  boot:
    name: 컨테이너 기동
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 애플리케이션 존재 여부 확인
        id: check
        run: |
          if [ -f api/gradlew ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "스캐폴딩 전입니다. 기동 확인을 건너뜁니다."
          fi

      # **사람이 쓰는 명령을 그대로 쓴다.** `./holdfast rebuild`가 다시 빌드하고,
      # 멈춘 컨테이너를 알리고, nginx 너머로 앱이 응답할 때까지 기다린다(#132).
      # 별도 스크립트를 두면 CI만 초록이고 사람이 쓰는 경로는 깨질 수 있다 —
      # 이 줄이 통과하면 README가 안내하는 명령도 동작한다는 뜻이다.
      - name: 스택을 다시 빌드해 띄운다
        if: steps.check.outputs.exists == 'true'
        run: ./holdfast rebuild

      # **`/api/health`만으로는 부족하다.** nginx가 app1·app2로 라운드로빈하므로
      # 한 대가 죽어 있어도 절반은 200이 온다 — `run-pages.sh` 7.4.0이 같은 주의를
      # 적었다. 컨테이너 전수를 세고, 응답에 실린 instance로 두 대를 다 확인한다.
      - name: 다섯 서비스가 모두 running인가
        if: steps.check.outputs.exists == 'true'
        run: |
          docker compose ps
          stopped=$(docker compose ps --all --format '{{.Service}} {{.State}}' |
                      awk '$2 != "running" { print $1 }' | paste -sd' ' -)
          if [ -n "$stopped" ]; then
            echo "::error::running이 아닌 서비스: $stopped"
            exit 1
          fi

      # jq를 쓰지 않는다 — 러너에는 있지만 개발자의 Git Bash에는 없어 **같은
      # 명령을 로컬에서 재현할 수 없게 된다.** 이 잡의 취지가 사람이 걷는 경로를
      # CI도 걷는 것이므로 POSIX 도구로만 쓴다.
      - name: 앱 두 대가 모두 응답하는가
        if: steps.check.outputs.exists == 'true'
        run: |
          seen=""
          for _ in $(seq 1 20); do
            inst=$(curl -sf http://localhost:8080/api/health |
                     grep -o '"instance":"[^"]*"' | cut -d'"' -f4)
            case " $seen " in
              *" $inst "*) ;;
              *) seen="$seen $inst" ;;
            esac
          done
          echo "응답한 인스턴스:$seen"
          for want in app1 app2; do
            case " $seen " in
              *" $want "*) ;;
              *) echo "::error::$want 이 20회 안에 한 번도 응답하지 않았다"; exit 1 ;;
            esac
          done

      # **화면까지 본다.** 헬스는 컨트롤러 하나만 지나지만 이 요청은 Thymeleaf
      # 렌더와 JPA 스키마 검증(`ddl-auto=validate`)까지 지난다 — 엔티티와
      # 마이그레이션이 어긋나 기동은 되고 화면에서 터지는 경우를 여기서 잡는다.
      - name: 사용자 화면이 렌더되나
        if: steps.check.outputs.exists == 'true'
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/programs)
          if [ "$code" != "200" ]; then
            echo "::error::/programs 가 $code 를 냈다"
            exit 1
          fi

      - name: 실패하면 로그를 남긴다
        if: failure() && steps.check.outputs.exists == 'true'
        run: docker compose logs --tail 200

      - name: 정리
        if: always() && steps.check.outputs.exists == 'true'
        run: docker compose down -v
