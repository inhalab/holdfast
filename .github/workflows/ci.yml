name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 빌드 및 테스트
        run: |
          if [ -f gradlew ]; then
            ./gradlew build
          else
            echo "스캐폴딩 전입니다. 빌드를 건너뜁니다."
          fi
