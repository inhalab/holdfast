# k6 부하 테스트 실행 환경.
# 설계서 7.3 "k6 실행 위치는 앱과 분리된 호스트" → k6를 앱과 별도 컨테이너로 띄운다.
#
# 이 파일은 기본 compose와 합쳐서 쓴다. k6는 'load' 프로파일로 분리해,
# 평소 `docker compose up`에는 뜨지 않고 부하 테스트할 때만 실행된다.
#
# 사용:
#   1) 앱 먼저 기동:   docker compose up -d
#   2) 부하 테스트:     docker compose -f docker-compose.yml -f docker-compose.k6.yml --profile load run --rm k6 run /scenarios/smoke.js
#   3) 결과는 load-test/results/ 에 JSON으로 남는다.
#
# 시나리오 파일(scenarios/*.js)은 최건(@Asirante, load-test 담당)이 작성한다.
# 이 파일은 '실행 환경'만 제공한다.

services:
  k6:
    image: grafana/k6:latest
    profiles: ["load"]
    # nginx(로드밸런서)를 통해 앱 2대로 부하를 보낸다. 앱 컨테이너를 직접 때리지 않는다.
    environment:
      # 시나리오에서 __ENV.BASE_URL 로 참조. 기본은 컨테이너 네트워크 내 nginx.
      BASE_URL: "${K6_BASE_URL:-http://nginx:80}"
    volumes:
      - ./load-test/scenarios:/scenarios:ro   # 시나리오(읽기 전용)
      - ./load-test/results:/results           # 결과 출력
    # k6가 앱과 같은 네트워크에 있어야 nginx:80 으로 접근 가능.
    # 별도 network 지정 없이 compose 기본 네트워크를 공유한다.
