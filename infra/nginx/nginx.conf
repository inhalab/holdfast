# 앱 2대로 요청을 분산하는 로드밸런서.
# AWS로 옮기면 이 역할을 ALB가 대신한다.

events {}

http {
    upstream holdfast_app {
        server app1:8080;
        server app2:8080;
    }

    server {
        listen 80;

        location / {
            proxy_pass http://holdfast_app;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }
}
