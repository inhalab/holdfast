# 앱 2대로 요청을 분산하는 로드밸런서.
# AWS로 옮기면 이 역할을 ALB가 대신한다.

events {
    # 기본값 512로는 부하 측정을 버티지 못한다.
    #
    # nginx는 커넥션 하나를 클라이언트 쪽과 업스트림 쪽 **양쪽**으로 센다.
    # 고경합 시나리오의 VU 500이면 최소 1000개가 필요한데, 512에서 막히면
    # nginx가 커넥션을 리셋한다. k6는 그것을 status 0으로 받아 오류율에
    # 집어넣으므로(scenarios/lib/classify.js), 앱이 5xx를 하나도 내지 않았는데도
    # 오류율 임계값이 깨지고 그 실행을 버리게 된다.
    #
    # 실제로 500 VU 측정에서 "512 worker_connections are not enough" alert이
    # 394건 찍혔다. 로드밸런서가 병목이면 측정 대상이 락 전략이 아니라 nginx가
    # 된다 — concurrency-spec 7.3이 커넥션 풀 크기를 두고 경고한 것과 같은 함정이다.
    worker_connections 8192;
}

http {
    upstream holdfast_app {
        server app1:8080;
        server app2:8080;
    }

    server {
        listen 80;

        location / {
            proxy_pass http://holdfast_app;
            # **$host가 아니라 $http_host다. 이 한 줄이 리다이렉트의 정답을
            # 가른다.** $host는 포트를 뗀 이름만 담는다.
            #
            # 앱은 상대 Location을 낸다(server.tomcat.use-relative-redirects).
            # 그런데 **nginx가 그 상대 경로를 여기서 넘긴 Host로 절대화한다** —
            # proxy_redirect off 로도 안 막힌다. 그래서 $host면 :8080이 사라져
            # 사용자가 http://localhost/ 로 튀고 연결이 거부된다. 실측 네 줄은
            # docs/design-spec.md 5.4에 있다.
            #
            # $http_host는 클라이언트가 보낸 Host를 포트째 그대로 넘긴다.
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            # **X-Forwarded-Proto / -Host / -Port는 보내지 않는다.** 앱이 읽지
            # 않는다(server.forward-headers-strategy 미설정). 그 헤더를 읽게
            # 하는 방식은 지켜야 할 설정을 하나에서 넷으로 늘릴 뿐이라
            # 택하지 않았다 — 근거는 design-spec 5.4. 읽는 쪽이 생기면 그때
            # 함께 넣는다. 아무도 안 읽는 헤더를 미리 두면 설정만 늘고 썩는다.
            #
            # **이 파일을 고치면 nginx를 reload해야 한다.** 바인드 마운트라
            # 컨테이너 안 파일은 바로 바뀌지만 nginx는 기동 시 읽은 설정으로
            # 계속 돈다. docker compose up -d 는 마운트된 파일이 바뀌었다고
            # 컨테이너를 다시 만들지 않는다 — 위의 Host 수정이 그래서 하루
            # 넘게 적용되지 않았다. ./holdfast up 이 reload를 함께 한다.
        }
    }
}
