openapi: 3.1.0

info:
  title: holdfast 예약 API
  version: 1.0.0
  summary: 좌석 단위 점유 제어 예약 흐름의 API 계약
  description: |
    좌석맵 조회 → 좌석 선점(hold) → 예약 확정 → 조회·취소까지의 계약이다.

    이 문서의 목적은 프론트 담당자가 서버 구현을 기다리지 않고 화면을 만들 수 있게
    하는 것이다. 요청·응답 스키마와 오류 코드는 확정이며, 변경은 두 사람의 작업을
    동시에 깨뜨린다. 변경이 필요하면 PR로 이 파일을 먼저 고친다.

    설계 결정의 근거는 `docs/api-spec.md`에 있다.

    ## 확정된 전제

    - **좌석 선택 상태는 클라이언트가 보관한다.** 서버 세션을 쓰지 않는다.
      앱 2대 구성에서 세션 공유는 측정 오염 요인이다 (concurrency-spec 0.4).
    - **모든 상태 변경 요청은 `Idempotency-Key` 헤더를 요구한다** (concurrency-spec 6절).
    - **409는 정상 거절이며 오류가 아니다.** 원인은 `code`로 구분한다.
      경합으로 인한 거절은 어떤 경우에도 5xx로 나가지 않는다 (concurrency-spec 7.1).
    - **모든 시각은 서버 기준이다.** 응답의 `serverTime`을 기준으로 남은 시간을
      계산한다. 클라이언트 시계를 신뢰하지 않는다 (design-spec 5.1).
  license:
    name: MIT
    identifier: MIT

servers:
  - url: http://localhost:8080
    description: 로컬 Docker Compose (nginx → 앱 2대)

# 인증은 요구사항 추적표(design-spec 3.1)에 없어 구현하지 않는다.
# 빈 배열은 "이 API에 인증 요구사항이 없다"는 명시적 선언이다.
# 사용자 식별은 X-User-Id 헤더가 대신하며 그 한계는 파라미터 설명에 적어두었다.
security: []

tags:
  - name: seats
    description: 좌석맵 조회 및 폴링
  - name: holds
    description: 좌석 선점과 해제
  - name: reservations
    description: 예약 확정·조회·취소

paths:
  /api/sessions/{sessionId}/seats:
    get:
      tags: [seats]
      operationId: getSeatMap
      summary: 좌석맵 전체 조회
      description: |
        회차의 좌석 배치와 현재 상태를 모두 반환한다. 화면 최초 진입 시 1회 호출한다.

        주기적 갱신에는 이 엔드포인트를 쓰지 않는다. 3초 폴링에는
        `/api/sessions/{sessionId}/seats/status`를 쓴다.
      parameters:
        - $ref: '#/components/parameters/SessionIdPath'
      responses:
        '200':
          description: 좌석맵
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SeatMap'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/sessions/{sessionId}/seats/status:
    get:
      tags: [seats]
      operationId: getSeatStatusSnapshot
      summary: 좌석 상태 스냅샷 (3초 폴링 전용)
      description: |
        좌석의 **상태만** 반환하는 경량 응답이다. htmx가 3초 간격으로 호출한다.

        전체 조회와의 차이:

        | | 전체 조회 | 폴링 |
        |---|---|---|
        | 좌석 정적 정보 (seatNo·rowIndex·colIndex·구역) | 포함 | **제외** |
        | 회차 메타 (reserveOpensAt·maxPerUser·sessionStatus) | 포함 | **제외** |
        | 좌석당 필드 수 | 6 | **2** |
        | heldUntil | 포함 | **제외** — 내 홀드의 만료는 홀드 응답으로 이미 알고 있다 |
        | 조건부 요청 | 없음 | `ETag` / `If-None-Match` → 304 |

        정적 정보는 회차 동안 변하지 않으므로 3초마다 다시 보낼 이유가 없다.
        `If-None-Match`를 보내면 상태가 그대로일 때 304와 빈 본문이 돌아간다.

        `Accept: text/html`로 호출하면 같은 데이터를 Thymeleaf 좌석맵 fragment로
        렌더링해 반환한다. htmx는 이쪽을 쓴다.
      parameters:
        - $ref: '#/components/parameters/SessionIdPath'
        - name: If-None-Match
          in: header
          required: false
          description: 직전 응답의 ETag. 상태가 변하지 않았으면 304가 돌아온다.
          schema:
            type: string
      responses:
        '200':
          description: 좌석 상태 스냅샷
          headers:
            ETag:
              description: 상태 스냅샷의 해시. 다음 폴링에 If-None-Match로 그대로 보낸다.
              schema:
                type: string
            Cache-Control:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SeatStatusSnapshot'
            text/html:
              schema:
                type: string
                description: 좌석맵 fragment (htmx 전용). JSON과 같은 데이터를 서버에서 렌더링한 것이다.
        '304':
          description: 직전 폴링 이후 좌석 상태가 변하지 않았다. 본문 없음.
          headers:
            ETag:
              schema:
                type: string
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/holds:
    post:
      tags: [holds]
      operationId: createHold
      summary: 좌석 선점 (복수 좌석)
      description: |
        좌석 여러 개를 한 번에 선점한다.

        **전부 아니면 전무다.** 요청한 좌석 중 하나라도 잡을 수 없으면 아무것도 잡지
        않고 409로 거절하며, 어떤 좌석이 왜 막혔는지 `conflicts`에 담아 돌려준다.
        부분 성공은 없다. 근거는 `docs/api-spec.md` 4절에 있다.

        서버는 좌석 ID를 오름차순으로 정렬해 획득한다 (erd.md 4.1, concurrency-spec 5.1).
        클라이언트가 보내는 순서는 결과에 영향을 주지 않는다.

        성공하면 holdId와 heldUntil을 돌려준다. **선택한 좌석 목록과 holdId는
        클라이언트가 보관한다.** 서버는 세션에 저장하지 않는다.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKeyHeader'
        - $ref: '#/components/parameters/UserIdHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HoldRequest'
      responses:
        '201':
          description: 선점 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Hold'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/HoldConflict'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/holds/{holdId}:
    delete:
      tags: [holds]
      operationId: releaseHold
      summary: 선점 해제
      description: |
        확정 전에 선점을 스스로 푼다. 좌석은 즉시 AVAILABLE로 돌아가고
        1인 최대 매수 집계에서도 빠진다.

        **멱등하다.** 이미 해제됐거나 만료된 홀드에 다시 호출해도 204를 반환한다.
        이미 확정된 홀드는 해제할 수 없고 409 HOLD_ALREADY_CONFIRMED가 나간다.
      parameters:
        - $ref: '#/components/parameters/HoldIdPath'
        - $ref: '#/components/parameters/IdempotencyKeyHeader'
        - $ref: '#/components/parameters/UserIdHeader'
      responses:
        '204':
          description: 해제됨. 이미 해제·만료된 홀드도 204다.
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/reservations:
    post:
      tags: [reservations]
      operationId: confirmReservation
      summary: 예약 확정
      description: |
        선점한 좌석을 확정해 판매 상태로 바꾼다. 이 프로젝트에서 가장 경합이 심한
        구간이다 (concurrency-spec CS-2).

        홀드가 만료된 뒤 도착한 확정 요청은 409 HOLD_EXPIRED로 거절된다. 만료 판정은
        확정 쿼리의 held_until > now() 조건으로 원자적으로 이뤄지므로, 만료와 확정이
        동시에 일어나도 좌석이 이중으로 팔리지 않는다 (concurrency-spec 3절).

        결제는 이 계약의 범위 밖이다. Mock PG 인터페이스는 별도 작업이며, 현재 계약의
        확정은 HELD → CONFIRMED 전이다.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKeyHeader'
        - $ref: '#/components/parameters/UserIdHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReservationCreateRequest'
      responses:
        '201':
          description: 확정됨
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Reservation'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/reservations/{reservationId}:
    get:
      tags: [reservations]
      operationId: getReservation
      summary: 예약 조회
      description: |
        본인의 예약만 조회할 수 있다. 다른 사용자의 예약 ID로 호출하면 존재 여부를
        흘리지 않기 위해 403이 아니라 404를 반환한다.
      parameters:
        - $ref: '#/components/parameters/ReservationIdPath'
        - $ref: '#/components/parameters/UserIdHeader'
      responses:
        '200':
          description: 예약
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Reservation'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/reservations/{reservationId}/cancel:
    post:
      tags: [reservations]
      operationId: cancelReservation
      summary: 예약 취소
      description: |
        확정된 예약을 취소하고 좌석을 반환한다. 좌석은 SOLD → AVAILABLE로 돌아가
        다시 판매된다.

        **멱등하다.** 이미 취소된 예약에 다시 호출하면 409가 아니라 200과 함께 기존
        취소 결과를 그대로 반환한다. 재시도가 실패로 보이지 않아야 하기 때문이다.
      parameters:
        - $ref: '#/components/parameters/ReservationIdPath'
        - $ref: '#/components/parameters/IdempotencyKeyHeader'
        - $ref: '#/components/parameters/UserIdHeader'
      responses:
        '200':
          description: 취소됨. 이미 취소된 예약도 200이다.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CancelResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'

components:

  parameters:

    SessionIdPath:
      name: sessionId
      in: path
      required: true
      description: 회차 ID
      schema:
        type: integer
        format: int64
        minimum: 1
      example: 1001

    HoldIdPath:
      name: holdId
      in: path
      required: true
      description: 선점 그룹 식별자. POST /api/holds 응답의 holdId다.
      schema:
        type: string
        format: uuid
      example: 3f2504e0-4f89-11d3-9a0c-0305e82c3301

    ReservationIdPath:
      name: reservationId
      in: path
      required: true
      description: 예약 ID
      schema:
        type: integer
        format: int64
        minimum: 1
      example: 55021

    IdempotencyKeyHeader:
      name: Idempotency-Key
      in: header
      required: true
      description: |
        클라이언트가 생성한 UUID. 상태를 바꾸는 모든 요청에 필수다 (concurrency-spec 6절).

        - 같은 키 + 같은 본문 → 저장된 응답을 그대로 재생한다. 상태는 다시 바뀌지 않는다.
        - 같은 키 + 다른 본문 → 409 IDEMPOTENCY_KEY_REUSED. 키 재사용 버그를 조용히
          통과시키지 않는다.
        - 같은 키로 아직 처리 중 → 409 IDEMPOTENCY_KEY_IN_PROGRESS. 잠시 뒤 재시도한다.

        **네트워크 재시도에서 키를 새로 만들지 않는다.** 새 키로 재시도하면 멱등성이
        사라져 좌석이 두 번 잡힌다. 사용자가 버튼을 다시 누른 것이라면 그때 새 키를 만든다.
      schema:
        type: string
        format: uuid
      example: 9c1f8e2a-7b31-4a6d-9f0e-2d5c8a1b3e77

    UserIdHeader:
      name: X-User-Id
      in: header
      required: true
      description: |
        요청자 식별자. 인증·회원 관리는 요구사항 추적표(design-spec 3.1)에 없어 구현하지
        않으므로 사용자 식별을 이 헤더로 대신한다. 인증이 붙으면 이 헤더는 토큰에서
        유도된 값으로 대체되고 계약의 나머지는 바뀌지 않는다.
      schema:
        type: integer
        format: int64
        minimum: 1
      example: 7001

  responses:

    BadRequest:
      description: 요청 형식이 잘못됨
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: about:blank
            title: Bad Request
            status: 400
            detail: seatIds는 비어 있을 수 없습니다.
            code: VALIDATION_FAILED
            serverTime: '2026-09-01T04:16:19Z'

    NotFound:
      description: 대상을 찾을 수 없음
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: about:blank
            title: Not Found
            status: 404
            detail: 회차를 찾을 수 없습니다.
            code: SESSION_NOT_FOUND
            serverTime: '2026-09-01T04:16:19Z'

    Conflict:
      description: |
        정상 거절. 시스템이 제대로 동작한 결과이며 오류가 아니다 (concurrency-spec 7.1).
        원인은 code로 구분한다.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: about:blank
            title: Conflict
            status: 409
            detail: 홀드가 만료되었습니다.
            code: HOLD_EXPIRED
            serverTime: '2026-09-01T04:16:19Z'

    InternalError:
      description: |
        서버 결함. **경합으로 인한 거절은 절대 여기로 오지 않는다.**
        이 응답이 나오면 측정에서 오류율로 집계된다 (concurrency-spec 7.1).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: about:blank
            title: Internal Server Error
            status: 500
            detail: 예기치 못한 오류가 발생했습니다.
            code: INTERNAL_ERROR
            serverTime: '2026-09-01T04:16:19Z'

    HoldConflict:
      description: |
        선점 거절. 전부 아니면 전무이므로 좌석은 하나도 잡히지 않았다.
        막힌 좌석은 conflicts에 좌석별 사유와 함께 들어 있다.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            seatContention:
              summary: 일부 좌석이 이미 팔렸거나 남이 잡고 있음
              value:
                type: about:blank
                title: Conflict
                status: 409
                detail: 요청한 좌석 중 2석을 선점할 수 없습니다.
                code: SEAT_HELD_BY_OTHER
                serverTime: '2026-09-01T04:16:19Z'
                conflicts:
                  - seatId: 30412
                    code: SEAT_ALREADY_SOLD
                  - seatId: 30415
                    code: SEAT_HELD_BY_OTHER
            quotaExceeded:
              summary: 1인 최대 매수 초과
              value:
                type: about:blank
                title: Conflict
                status: 409
                detail: 1인 최대 4매까지 예약할 수 있습니다. 현재 3매 보유 중입니다.
                code: QUOTA_EXCEEDED
                serverTime: '2026-09-01T04:16:19Z'
            notOpen:
              summary: 예약 오픈 전
              value:
                type: about:blank
                title: Conflict
                status: 409
                detail: 예약 오픈 전입니다.
                code: RESERVATION_NOT_OPEN
                serverTime: '2026-09-01T04:16:19Z'

  schemas:

    SeatStatus:
      type: string
      description: |
        좌석재고의 현재 상태 (erd.md seat_inventory.status).

        - AVAILABLE — 선택 가능
        - HELD — 누군가 선점 중. 내 홀드인지 남의 홀드인지는 이 값으로 구분되지 않는다.
          클라이언트는 자신이 보관한 좌석 목록과 대조해 판단한다.
        - SOLD — 판매 완료
      enum: [AVAILABLE, HELD, SOLD]

    ErrorCode:
      type: string
      description: |
        오류·거절 사유 코드. **k6는 이 값으로 태깅해 집계한다.** 문자열이 바뀌면 측정
        스크립트가 함께 깨지므로 값을 변경하거나 다른 의미로 재사용하지 않는다.

        분류는 docs/api-spec.md 3절의 표를 따른다.
      enum:
        - SEAT_ALREADY_SOLD
        - SEAT_HELD_BY_OTHER
        - HOLD_EXPIRED
        - HOLD_RELEASED
        - HOLD_ALREADY_CONFIRMED
        - QUOTA_EXCEEDED
        - RESERVATION_NOT_OPEN
        - RESERVATION_ALREADY_CANCELLED
        - RESERVATION_NOT_CANCELLABLE
        - LOCK_TIMEOUT
        - IDEMPOTENCY_KEY_REUSED
        - IDEMPOTENCY_KEY_IN_PROGRESS
        - VALIDATION_FAILED
        - SESSION_NOT_FOUND
        - SEAT_NOT_IN_SESSION
        - HOLD_NOT_FOUND
        - RESERVATION_NOT_FOUND
        - INTERNAL_ERROR

    Problem:
      type: object
      description: |
        RFC 9457 Problem Details. Spring Boot 4가 처리하지 못한 예외에도 같은 형식을
        내보내므로 클라이언트가 다루는 오류 표현이 하나로 유지된다.
      required: [status, code]
      properties:
        type:
          type: string
          format: uri
          default: about:blank
        title:
          type: string
          examples: [Conflict]
        status:
          type: integer
          examples: [409]
        detail:
          type: string
          description: 사용자에게 그대로 보여줄 수 있는 한국어 설명.
        instance:
          type: string
          description: 요청 경로
        code:
          $ref: '#/components/schemas/ErrorCode'
        serverTime:
          type: string
          format: date-time
          description: 서버 기준 현재 시각
        conflicts:
          type: array
          description: 좌석별 거절 사유. POST /api/holds의 409에만 들어 있다.
          items:
            $ref: '#/components/schemas/SeatConflict'

    SeatConflict:
      type: object
      required: [seatId, code]
      properties:
        seatId:
          type: integer
          format: int64
          examples: [30412]
        code:
          $ref: '#/components/schemas/ErrorCode'

    SeatMap:
      type: object
      description: 좌석맵 전체. 화면 최초 진입 시 1회 받는다.
      required: [sessionId, sessionStatus, serverTime, maxPerUser, zones]
      properties:
        sessionId:
          type: integer
          format: int64
          examples: [1001]
        sessionStatus:
          type: string
          enum: [SCHEDULED, OPEN, CLOSED]
          description: 회차 상태. SCHEDULED면 아직 예약 오픈 전이다.
        reserveOpensAt:
          type: string
          format: date-time
          description: 예약 오픈 일시 (REQ-08). 이 시각 전의 선점은 409 RESERVATION_NOT_OPEN이다.
        startsAt:
          type: string
          format: date-time
        endsAt:
          type: string
          format: date-time
        maxPerUser:
          type: integer
          description: 1인 최대 매수 (REQ-03). 클라이언트가 선택 단계에서 미리 막을 수 있다.
          examples: [4]
        holdTtlSeconds:
          type: integer
          description: |
            선점 유지 시간. 부하 측정 시에는 짧게 바꾸므로 (concurrency-spec 3절)
            클라이언트가 값을 하드코딩하지 않는다.
          examples: [300]
        serverTime:
          type: string
          format: date-time
        zones:
          type: array
          items:
            $ref: '#/components/schemas/SeatMapZone'

    SeatMapZone:
      type: object
      required: [zoneId, name, seats]
      properties:
        zoneId:
          type: integer
          format: int64
        name:
          type: string
          examples: [A구역]
        sortOrder:
          type: integer
        seats:
          type: array
          items:
            $ref: '#/components/schemas/SeatMapSeat'

    SeatMapSeat:
      type: object
      required: [seatId, seatNo, rowIndex, colIndex, status]
      properties:
        seatId:
          type: integer
          format: int64
          examples: [30412]
        seatNo:
          type: string
          examples: [A-12]
        rowIndex:
          type: integer
        colIndex:
          type: integer
        status:
          $ref: '#/components/schemas/SeatStatus'

    SeatStatusSnapshot:
      type: object
      description: |
        폴링 전용 경량 응답. 좌석당 seatId와 status 두 필드만 담는다.
        정적 정보는 전체 조회에서 이미 받았으므로 다시 보내지 않는다.
      required: [sessionId, serverTime, seats]
      properties:
        sessionId:
          type: integer
          format: int64
        serverTime:
          type: string
          format: date-time
        seats:
          type: array
          items:
            $ref: '#/components/schemas/SeatStatusEntry'

    SeatStatusEntry:
      type: object
      required: [seatId, status]
      properties:
        seatId:
          type: integer
          format: int64
        status:
          $ref: '#/components/schemas/SeatStatus'

    HoldRequest:
      type: object
      required: [sessionId, seatIds]
      properties:
        sessionId:
          type: integer
          format: int64
          examples: [1001]
        seatIds:
          type: array
          description: |
            선점할 좌석 ID 목록. 중복 값은 400이다. 서버가 오름차순으로 정렬해 획득하므로
            클라이언트가 보내는 순서는 결과에 영향을 주지 않는다.
          minItems: 1
          uniqueItems: true
          items:
            type: integer
            format: int64
          examples:
            - [30412, 30413, 30414]

    Hold:
      type: object
      description: |
        선점 결과. holdId와 좌석 목록은 **클라이언트가 보관한다.**
        서버 세션에 저장되지 않으므로 잃어버리면 만료를 기다리는 수밖에 없다.
      required: [holdId, sessionId, userId, seatIds, heldUntil, serverTime]
      properties:
        holdId:
          type: string
          format: uuid
        sessionId:
          type: integer
          format: int64
        userId:
          type: integer
          format: int64
        seatIds:
          type: array
          description: 선점된 좌석 ID. 항상 오름차순이다.
          items:
            type: integer
            format: int64
          examples:
            - [30412, 30413, 30414]
        heldUntil:
          type: string
          format: date-time
          description: 선점 만료 시각 (서버 기준).
        expiresInSeconds:
          type: integer
          description: |
            heldUntil - serverTime. 클라이언트가 시계 차이를 신경 쓰지 않고 바로
            카운트다운을 걸 수 있도록 함께 준다.
          examples: [300]
        serverTime:
          type: string
          format: date-time

    ReservationCreateRequest:
      type: object
      required: [holdId]
      properties:
        holdId:
          type: string
          format: uuid
          description: 확정할 선점의 식별자.

    Reservation:
      type: object
      required: [reservationId, sessionId, userId, status, seats, serverTime]
      properties:
        reservationId:
          type: integer
          format: int64
          examples: [55021]
        sessionId:
          type: integer
          format: int64
        userId:
          type: integer
          format: int64
        status:
          type: string
          description: |
            예약 상태 (design-spec 3.3, erd.md reservation.status).
            PENDING_PAYMENT는 Mock PG 연동 시점에 쓰이며 현재 계약에서는 나오지 않는다.
          enum: [HELD, PENDING_PAYMENT, CONFIRMED, CANCELLED, EXPIRED]
        seats:
          type: array
          items:
            $ref: '#/components/schemas/ReservationSeat'
        totalAmount:
          type: [integer, 'null']
          description: |
            결제 금액. 요금 정책은 요구사항 추적표에 없어 현재 0으로 고정한다.
            Mock PG 작업에서 확정되면 이 필드를 채운다.
        confirmedAt:
          type: [string, 'null']
          format: date-time
        cancelledAt:
          type: [string, 'null']
          format: date-time
        serverTime:
          type: string
          format: date-time

    ReservationSeat:
      type: object
      required: [seatId, seatNo, zoneName]
      properties:
        seatId:
          type: integer
          format: int64
        seatNo:
          type: string
          examples: [A-12]
        zoneName:
          type: string
          examples: [A구역]

    CancelResult:
      type: object
      required: [reservationId, status, cancelledAt, releasedSeatIds, serverTime]
      properties:
        reservationId:
          type: integer
          format: int64
        status:
          type: string
          const: CANCELLED
        cancelledAt:
          type: string
          format: date-time
        releasedSeatIds:
          type: array
          description: 반환되어 다시 판매 가능해진 좌석.
          items:
            type: integer
            format: int64
        serverTime:
          type: string
          format: date-time
