<svg xmlns="http://www.w3.org/2000/svg" width="980" height="584" viewBox="0 0 980 584" font-family="'Malgun Gothic','Apple SD Gothic Neo',system-ui,-apple-system,'Segoe UI',sans-serif">
<rect width="980" height="584" fill="#fcfcfb"/>
<text x="26" y="40" font-size="20" font-weight="700" fill="#0b0b0b">2차 측정 — 비교가 아니라 밟기</text>
<text x="26" y="66" font-size="13" fill="#52514e">한 전략으로, 아무도 지나간 적 없는 코드 경로를 일부러 밟아 깨지는지만 본다</text>
<rect x="26" y="104" width="934" height="40" fill="#f4f3f0"/>
<text x="38" y="129" font-size="12.5" font-weight="700" fill="#52514e"></text>
<text x="188" y="129" font-size="12.5" font-weight="700" fill="#52514e">CS-6 · 할당량 경합</text>
<text x="588" y="129" font-size="12.5" font-weight="700" fill="#52514e">CS-4 · 취소와 재선점</text>
<line x1="26" y1="144" x2="960" y2="144" stroke="#e8e7e3" stroke-width="1"/>
<text x="38" y="173.5" font-size="13" fill="#0b0b0b" font-weight="700">무엇이 문제</text>
<text x="188" y="163.0" font-size="12.5" fill="#52514e">같은 사람이 다른 좌석 둘을 동시에</text>
<text x="188" y="184.0" font-size="11.5" fill="#8a8a84">좌석 락이 못 막는다 — 막는 건 할당량 행 하나</text>
<text x="588" y="163.0" font-size="12.5" fill="#52514e">확정된 좌석을 취소가 겹쳐 두 번 반환</text>
<text x="588" y="184.0" font-size="11.5" fill="#8a8a84">검증 쿼리·부하 경로·동시성 테스트 셋 다 없었다</text>
<line x1="26" y1="194" x2="960" y2="194" stroke="#e8e7e3" stroke-width="1"/>
<text x="38" y="221.5" font-size="13" fill="#0b0b0b" font-weight="700">한 반복</text>
<text x="188" y="221.5" font-size="12.5" fill="#52514e">홀드 → 해제</text>
<text x="588" y="221.5" font-size="12.5" fill="#52514e">홀드 → 확정 → 취소 둘을 동시에</text>
<line x1="26" y1="240" x2="960" y2="240" stroke="#e8e7e3" stroke-width="1"/>
<text x="38" y="269.5" font-size="13" fill="#0b0b0b" font-weight="700">규모</text>
<text x="188" y="259.0" font-size="12.5" fill="#52514e">좌석 1000 · VU 500 · 사용자 20</text>
<text x="188" y="280.0" font-size="11.5" fill="#8a8a84">120초 × 3회 · 요청 147만</text>
<text x="588" y="259.0" font-size="12.5" fill="#52514e">좌석 200 · VU 500 · 사용자 500</text>
<text x="588" y="280.0" font-size="11.5" fill="#8a8a84">120초 × 3회 · 취소 쌍 15만</text>
<line x1="26" y1="290" x2="960" y2="290" stroke="#e8e7e3" stroke-width="1"/>
<text x="38" y="319.5" font-size="13" fill="#0b0b0b" font-weight="700">판정</text>
<text x="188" y="309.0" font-size="12.5" fill="#52514e">Q-1 동시 점유 상한 초과</text>
<text x="188" y="330.0" font-size="11.5" fill="#8a8a84">Q-2 카운터 정합 · Q-3 V-3</text>
<text x="588" y="309.0" font-size="12.5" fill="#52514e">C-1 좌석 동시 확정 보유</text>
<text x="588" y="330.0" font-size="11.5" fill="#8a8a84">C-2 풀린 좌석 · C-3 카운터 · C-4 V-1·V-4</text>
<line x1="26" y1="340" x2="960" y2="340" stroke="#cfcec9" stroke-width="1"/>
<text x="38" y="369.5" font-size="13" fill="#0b0b0b" font-weight="700">밟았다는 증거</text>
<text x="188" y="359.0" font-size="13" fill="#1baf7a" font-weight="700">동시 점유 최댓값 = 4 = 상한</text>
<text x="188" y="380.0" font-size="11.5" fill="#8a8a84">상한에 닿았고 넘지 않았다</text>
<text x="588" y="359.0" font-size="13" fill="#1baf7a" font-weight="700">재선점 20만 회</text>
<text x="588" y="380.0" font-size="11.5" fill="#8a8a84">좌석이 돌아와 다시 팔렸다</text>
<line x1="26" y1="390" x2="960" y2="390" stroke="#e8e7e3" stroke-width="1"/>
<text x="38" y="419.5" font-size="13" fill="#0b0b0b" font-weight="700">결과</text>
<text x="188" y="409.0" font-size="13" fill="#1baf7a" font-weight="700">전 회차 위반 0</text>
<text x="188" y="430.0" font-size="11.5" fill="#8a8a84">오류율 0 · 미분류 0</text>
<text x="588" y="409.0" font-size="13" fill="#1baf7a" font-weight="700">전 회차 위반 0</text>
<text x="588" y="430.0" font-size="11.5" fill="#8a8a84">오류율 0 · 미분류 0</text>
<rect x="26" y="440" width="934" height="50" fill="#fdf2ec"/>
<line x1="26" y1="440" x2="960" y2="440" stroke="#cfcec9" stroke-width="1"/>
<text x="38" y="469.5" font-size="13" fill="#0b0b0b" font-weight="700">못 본 것</text>
<text x="188" y="469.5" font-size="12.5" fill="#52514e">—</text>
<text x="588" y="459.0" font-size="12.5" fill="#52514e">부하는 C-3 을 구조적으로 못 본다</text>
<text x="588" y="480.0" font-size="11.5" fill="#8a8a84">단위 경합 테스트가 결함을 잡았다 — #209</text>
<line x1="26" y1="490" x2="960" y2="490" stroke="#cfcec9" stroke-width="1"/>
<text x="26" y="524" font-size="12.5" fill="#0b0b0b">p95 도 TPS 도 재지 않는다 — 요청 종류가 늘면 그 값이 1차 60회와 비교 대상을 잃는다.</text>
<text x="26" y="543" font-size="12.5" fill="#0b0b0b">«깨질 수 없다»가 아니라 «이 조건에서 안 깨졌다»다. 0 은 관측하지 못했다는 뜻이다.</text>
</svg>
