<path d="M1000 362 C 1060 362, 1100 388, 1150 388" fill="none" stroke="#2a78d6" stroke-width="3" marker-end="url(#aB)"/>
<text x="1162" y="342" font-size="17" fill="#0b0b0b" font-weight="700">A  1be8c479</text>
<text x="1162" y="395" font-size="17" fill="#0b0b0b" font-weight="700">B  51730cc8</text>
<rect x="1318" y="340" width="153" height="48" rx="24" fill="#eef8f4" stroke="#1baf7a" stroke-width="2"/>
<text x="1394" y="375" font-size="28" fill="#1baf7a" font-weight="700" text-anchor="middle">12 : 12</text>
<text x="1318" y="418" font-size="15" fill="#8a8a84">앱이 정말 두 대다</text>
<text x="48" y="466" font-size="20" fill="#0b0b0b" font-weight="700">https://admin.inhalab.cloud</text>
<text x="48" y="492" font-size="15" fill="#8a8a84">관리자 화면</text>
<path d="M330 470 H578" fill="none" stroke="#7a7973" stroke-width="3" marker-end="url(#aN)"/>
<rect x="588" y="444" width="88" height="48" rx="24" fill="#eef4fc" stroke="#2a78d6" stroke-width="2"/>
<text x="632" y="479" font-size="28" fill="#2a78d6" font-weight="700" text-anchor="middle">302</text>
<line x1="690" y1="436" x2="690" y2="504" stroke="#e34948" stroke-width="6" stroke-linecap="round"/>
<text x="698" y="430" font-size="15" fill="#e34948" font-weight="700">Access</text>
