<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" font-family="'Malgun Gothic','Apple SD Gothic Neo',system-ui,-apple-system,'Segoe UI',sans-serif">
<title>전 구간 기동 — 확인 다섯이 각각 어디까지 닿았나</title>
<desc>요청 다섯이 Cloudflare 엣지, ALB, Fargate 태스크 두 대 중 어디까지 닿고 어디서 멈췄는지. app 은 200 으로 태스크까지 닿고 24회가 12 대 12 로 갈렸다. admin 은 엣지의 Access 에서 302, http 는 앱에 닿기 전에 301, ALB 직행은 보안그룹에서 무응답 000.</desc>
<rect width="1600" height="900" fill="#fcfcfb"/>
<defs>
<marker id="aB" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 z" fill="#2a78d6"/></marker>
<marker id="aG" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 z" fill="#1baf7a"/></marker>
<marker id="aR" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 z" fill="#e34948"/></marker>
<marker id="aN" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 z" fill="#7a7973"/></marker>
</defs>
<text x="48" y="70" font-size="34" fill="#0b0b0b" font-weight="700">전 구간 기동 — 확인 다섯이 각각 어디까지 닿았나</text>
<text x="48" y="110" font-size="19" fill="#52514e">2026-09-23, 엣지와 오리진을 같은 순간에 세우고 쟀다. 그 전에는 둘을 따로 봐서 app 의 성공 신호가 503 이었다</text>
<rect x="470" y="146" width="290" height="590" rx="12" fill="#f2f2f0"/>
<text x="488" y="180" font-size="21" fill="#0b0b0b" font-weight="700">Cloudflare 엣지</text>
<text x="488" y="206" font-size="15" fill="#8a8a84">최건 계정</text>
<rect x="800" y="146" width="270" height="590" rx="12" fill="#f2f2f0"/>
<text x="818" y="180" font-size="21" fill="#0b0b0b" font-weight="700">ALB</text>
<text x="818" y="206" font-size="15" fill="#8a8a84">박태준 계정 · AWS 서울</text>
<rect x="1110" y="146" width="442" height="590" rx="12" fill="#f2f2f0"/>
<text x="1128" y="180" font-size="21" fill="#0b0b0b" font-weight="700">Fargate 태스크 2대</text>
<text x="1128" y="206" font-size="15" fill="#8a8a84">태스크 정의 하나 · desired_count 2</text>
<text x="48" y="180" font-size="21" fill="#0b0b0b" font-weight="700">요청</text>
<text x="48" y="266" font-size="20" fill="#0b0b0b" font-weight="700">https://app.inhalab.cloud</text>
<text x="48" y="292" font-size="15" fill="#8a8a84">좌석 화면</text>
<path d="M330 270 H1150" fill="none" stroke="#2a78d6" stroke-width="3" marker-end="url(#aB)"/>
<rect x="1168" y="244" width="88" height="48" rx="24" fill="#eef8f4" stroke="#1baf7a" stroke-width="2"/>
<text x="1212" y="279" font-size="28" fill="#1baf7a" font-weight="700" text-anchor="middle">200</text>
<text x="1270" y="268" font-size="17" fill="#0b0b0b" font-weight="700">좌석 화면이 렌더됐다</text>
<text x="1270" y="292" font-size="15" fill="#8a8a84">/api/health: db up · redis down</text>
<text x="48" y="358" font-size="20" fill="#0b0b0b" font-weight="700">같은 주소 24회</text>
<text x="48" y="384" font-size="15" fill="#8a8a84">어느 태스크가 받았나 — 화면의 배지</text>
