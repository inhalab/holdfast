<text x="704" y="571" font-size="28" fill="#2a78d6" font-weight="700" text-anchor="middle">301</text>
<path d="M758 528 h26 v68 h-26" fill="none" stroke="#e34948" stroke-width="3"/>
<text x="330" y="596" font-size="15" fill="#8a8a84">→ https 로 — 앱에 닿기 전에 되돌린다</text>
<text x="48" y="650" font-size="20" fill="#0b0b0b" font-weight="700">ALB 주소로 직행</text>
<text x="48" y="676" font-size="15" fill="#8a8a84">엣지를 거치지 않는 요청</text>
<path d="M330 654 H778" fill="none" stroke="#e34948" stroke-width="3" stroke-dasharray="8 7" marker-end="url(#aR)"/>
<text x="480" y="642" font-size="15" fill="#e34948">엣지를 거치지 않는다</text>
<line x1="792" y1="620" x2="792" y2="688" stroke="#e34948" stroke-width="6" stroke-linecap="round"/>
<text x="810" y="614" font-size="15" fill="#e34948" font-weight="700">보안그룹</text>
<rect x="830" y="628" width="88" height="48" rx="24" fill="#fbf1f1" stroke="#e34948" stroke-width="2"/>
<text x="874" y="663" font-size="28" fill="#e34948" font-weight="700" text-anchor="middle">000</text>
<text x="932" y="652" font-size="17" fill="#0b0b0b" font-weight="700">무응답 — 502 도 아니다</text>
<text x="932" y="676" font-size="15" fill="#8a8a84">보안그룹이 Cloudflare 대역만 받는다</text>
<rect x="48" y="764" width="1504" height="62" rx="10" fill="#eef8f4"/>
<text x="70" y="794" font-size="20" fill="#0b0b0b" font-weight="700">내린 뒤 — 66 destroyed · 과금되는 리소스 0</text>
<text x="70" y="816" font-size="15" fill="#52514e">태그 목록이 아니라 AWS 에 직접 물어 확인했다. 태그 목록은 지운 뒤에도 서비스·태스크 정의가 있다고 답했다</text>
<text x="48" y="862" font-size="15" fill="#8a8a84">정본: infra/terraform/README.md 「전 구간 확인 — 2026-09-23」 (#231 · #42)  ·  301 을 돌려준 층이 엣지인지 ALB :80 인지는 기록에 없다</text>
