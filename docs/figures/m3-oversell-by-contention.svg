<text x="290.7" y="249" font-size="12" fill="#8a8a84" text-anchor="middle">1</text>
<line x1="403.3" y1="96" x2="403.3" y2="228" stroke="#e8e7e3" stroke-width="1"/>
<text x="403.3" y="249" font-size="12" fill="#8a8a84" text-anchor="middle">2</text>
<line x1="516.0" y1="96" x2="516.0" y2="228" stroke="#e8e7e3" stroke-width="1"/>
<text x="516.0" y="249" font-size="12" fill="#8a8a84" text-anchor="middle">3</text>
<line x1="628.7" y1="96" x2="628.7" y2="228" stroke="#e8e7e3" stroke-width="1"/>
<text x="628.7" y="249" font-size="12" fill="#8a8a84" text-anchor="middle">4</text>
<line x1="741.3" y1="96" x2="741.3" y2="228" stroke="#e8e7e3" stroke-width="1"/>
<text x="741.3" y="249" font-size="12" fill="#8a8a84" text-anchor="middle">5</text>
<line x1="854.0" y1="96" x2="854.0" y2="228" stroke="#e8e7e3" stroke-width="1"/>
<text x="854.0" y="249" font-size="12" fill="#8a8a84" text-anchor="middle">6</text>
<text x="854" y="270" font-size="12" fill="#8a8a84" text-anchor="end">초과 확정 건수 (회당)</text>
<text x="160" y="136.0" font-size="14" font-weight="700" fill="#b3282a" text-anchor="end">none</text>
<text x="160" y="152.0" font-size="10.5" fill="#8a8a84" text-anchor="end">락 없음 — 대조군</text>
<line x1="178" y1="135.0" x2="854" y2="135.0" stroke="#e8e7e3" stroke-width="1"/>
<circle cx="178.0" cy="135.0" r="8" fill="#2a78d6" stroke="#fcfcfb" stroke-width="2"/>
<text x="178.0" y="118.0" font-size="12.5" font-weight="700" fill="#52514e" text-anchor="middle">0 · 0 · 0</text>
<circle cx="290.7" cy="135.0" r="8" fill="#1baf7a" stroke="#fcfcfb" stroke-width="2"/>
<text x="290.7" y="118.0" font-size="12.5" font-weight="700" fill="#52514e" text-anchor="middle">1 · 1 · 1</text>
<circle cx="516.0" cy="135.0" r="7" fill="#eb6834" stroke="#fcfcfb" stroke-width="2"/>
<text x="516.0" y="119.0" font-size="12.5" font-weight="700" fill="#52514e" text-anchor="middle">3</text>
<circle cx="628.7" cy="135.0" r="7" fill="#eb6834" stroke="#fcfcfb" stroke-width="2"/>
<text x="628.7" y="119.0" font-size="12.5" font-weight="700" fill="#52514e" text-anchor="middle">4</text>
<circle cx="741.3" cy="135.0" r="7" fill="#eb6834" stroke="#fcfcfb" stroke-width="2"/>
<text x="741.3" y="119.0" font-size="12.5" font-weight="700" fill="#52514e" text-anchor="middle">5</text>
<line x1="26" y1="166.0" x2="854" y2="166.0" stroke="#cfcec9" stroke-width="1" stroke-dasharray="5 5"/>
<text x="160" y="198.0" font-size="14" font-weight="700" fill="#0b0b0b" text-anchor="end">락 전략 넷</text>
<text x="160" y="214.0" font-size="10.5" fill="#8a8a84" text-anchor="end">넷 다 같다</text>
<line x1="178" y1="197.0" x2="854" y2="197.0" stroke="#e8e7e3" stroke-width="1"/>
