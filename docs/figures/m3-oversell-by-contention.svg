<circle cx="178.0" cy="207.0" r="7" fill="#1baf7a" stroke="#fcfcfb" stroke-width="2"/>
<text x="195.0" y="202.0" font-size="12.5" font-weight="700" fill="#52514e" text-anchor="start">36회 전부 0</text>
<circle cx="32.0" cy="292.0" r="6" fill="#2a78d6" stroke="#fcfcfb" stroke-width="2"/>
<text x="46.0" y="296.0" font-size="12.5" fill="#52514e">저경합 1000석 / 100 VU</text>
<circle cx="229.6" cy="292.0" r="6" fill="#eb6834" stroke="#fcfcfb" stroke-width="2"/>
<text x="243.6" y="296.0" font-size="12.5" fill="#52514e">고경합 10석 / 500 VU</text>
<circle cx="408.8" cy="292.0" r="6" fill="#1baf7a" stroke="#fcfcfb" stroke-width="2"/>
<text x="422.8" y="296.0" font-size="12.5" fill="#52514e">극단 1석 / 200 VU</text>
<text x="26" y="322" font-size="12.5" fill="#0b0b0b">none 의 저경합 0 은 결함이 사라진 것이 아니라 1000석에 100 VU 면 같은 좌석을 동시에 노릴 일이 거의 없어서다.</text>
<text x="26" y="341" font-size="12.5" fill="#0b0b0b">pessimistic · optimistic · unique · redis 는 36회가 전부 0이다 — 아래 줄에 세 점으로 쌓아 두었다.</text>
</svg>
