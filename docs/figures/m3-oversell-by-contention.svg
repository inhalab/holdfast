<svg xmlns="http://www.w3.org/2000/svg" width="900" height="353" viewBox="0 0 900 353" font-family="'Malgun Gothic','Apple SD Gothic Neo',system-ui,-apple-system,'Segoe UI',sans-serif">
<rect width="900" height="353" fill="#fcfcfb"/>
<text x="26" y="38" font-size="19" font-weight="700" fill="#0b0b0b">초과 확정은 경합의 함수다 — 그리고 락을 걸면 사라진다</text>
<text x="26" y="62" font-size="13" fill="#52514e">V-1 초과 확정 건수. 경합도별 3회를 그대로 찍었다 — 중앙값으로 요약하지 않는다</text>
<rect x="26" y="104.0" width="828" height="62" fill="#fbf1f1"/>
