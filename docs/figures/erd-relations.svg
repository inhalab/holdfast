<text x="40.0" y="575.0" font-size="11" fill="#52514e">reservation ||--|{ reservation_seat (최소 1)  ·  reservation_seat ||--o| ticket  ·  reservation |o--o| idempotency_record</text>
<text x="40.0" y="593.0" font-size="11" fill="#52514e">좌석 수를 늘리면 경합이 흩어지고 줄이면 몰린다 — 경합도 3단계가 바로 seat_inventory 행 수다.</text>
